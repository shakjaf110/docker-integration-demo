version: "3.3"
services:
  postgresql-demo:
    image: postgres:latest
    container_name: postgresql-demo
    ports:
      - "5434:5432"
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    tmpfs:
      - /tmp
      - /run/postgresql
    volumes:
      #- ./docker_build/postgresql/init.d:/docker-entrypoint-initdb.d
      - ./dbschema.sql:/docker-entrypoint-initdb.d/dbschema.sql
    restart: always
    networks:
      - test_network

  jenkins-demo:
    image: jenkins/jenkins:lts
    restart: unless-stopped
    privileged: true
    user: root
    ports:
      - 9080:8080
      - 50000:50000
    container_name: jenkins-demo
    volumes:
      - ./docker_data/jenkins:/var/jenkins_home
      - ./docker_data/docker.sock:/var/run/docker.sock
    networks:
      - test_network

  sonarqube:
    image: sonarqube:latest
    container_name: sonarqube
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgresql-demo:5432/testdemo
      SONAR_JDBC_USERNAME: postgres
      SONAR_JDBC_PASSWORD: postgres
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_temp:/opt/sonarqube/temp
    depends_on:
      - postgresql-demo
    networks:
      - test_network

volumes:
  demo-kafka-data:
    driver: local
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  sonarqube_temp:

networks:
  test_network:
    driver: bridge